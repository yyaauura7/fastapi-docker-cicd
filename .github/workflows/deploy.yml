name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  ci-test:
    name: Build and Healthcheck Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fastapi-cicd-app:ci .

      - name: Run container and verify /health
        run: |
          docker run -d --name ci-test-app -p 127.0.0.1:8000:8000 -e APP_ENV=testing fastapi-cicd-app:ci
          sleep 3
          curl -f http://127.0.0.1:8000/health
          docker rm -f ci-test-app

  cd-deploy:
    name: Deploy to VPS via SSH
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/fastapi-docker-cicd
            git pull origin main
            docker compose up -d --build
            sleep 3
            curl -f http://127.0.0.1:8000/health
            docker image prune -f
